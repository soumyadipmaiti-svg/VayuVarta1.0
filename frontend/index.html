<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ══ Primary SEO ══ -->
    <title>Vayu Varta — AI Weather Intelligence & Early Warning System for India</title>
    <meta name="description" content="Vayu Varta is an AI-powered weather app for India with live forecasts, GPS auto-detection, Bengali & Hindi voice assistant (VayuGPT), and AI-prioritized early warnings before cyclones, floods, and heat waves hit." />
    <meta name="keywords" content="weather app India, Vayu Varta, AI weather assistant, Bengali weather, Hindi weather, cyclone alert, flood warning, heat wave alert, West Bengal weather, live weather forecast, weather voice assistant" />
    <meta name="author" content="Vayu Varta" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#05070B" />
    <meta name="application-name" content="Vayu Varta" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- ══ Regional / local SEO (target: West Bengal & India) ══ -->
    <meta name="geo.region" content="IN-WB" />
    <meta name="geo.placename" content="West Bengal, India" />
    <meta name="geo.position" content="22.5726;88.3639" />
    <meta name="ICBM" content="22.5726, 88.3639" />

    <!-- ══ Canonical (replace with your real domain after deploy) ══ -->
    <link rel="canonical" href="https://vayu-varta1-0.vercel.app/" />

    <!-- ══ Open Graph (Facebook / WhatsApp / LinkedIn) ══ -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vayu Varta" />
    <meta property="og:title" content="Vayu Varta — AI Weather Intelligence & Early Warning System" />
    <meta property="og:description" content="Live weather, GPS auto-detection, and AI-prioritized alarms before cyclones, floods and heat waves. Ask VayuGPT in English, Bengali or Hindi — by typing or voice." />
    <!-- og:image MUST be an absolute URL → replace vayuvarta.example.com with your live domain -->
    <meta property="og:image" content="https://vayu-varta1-0.vercel.app/logo.png" />
    <meta property="og:image:alt" content="Vayu Varta logo" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:url" content="https://vayu-varta1-0.vercel.app/" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:locale:alternate" content="bn_IN" />
    <meta property="og:locale:alternate" content="hi_IN" />

    <!-- ══ Twitter Card ══ -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vayu Varta — AI Weather Intelligence" />
    <meta name="twitter:description" content="Live forecasts + AI early warnings before cyclones, floods & heat waves. Voice assistant in English, Bengali & Hindi." />
    <meta name="twitter:image" content="https://vayu-varta1-0.vercel.app/logo.png" />

    <!-- ══ Structured data (JSON-LD) ══ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Vayu Varta",
      "alternateName": "VayuVarta",
      "description": "AI-prioritized weather early warning system for India: live forecasts, GPS auto-detection, voice assistant in English, Bengali and Hindi.",
      "url": "https://vayu-varta1-0.vercel.app/",
      "applicationCategory": "WeatherApplication",
      "operatingSystem": "Web",
      "inLanguage": ["en", "bn", "hi"],
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "INR" },
      "publisher": {
        "@type": "Organization",
        "name": "Vayu Varta",
        "logo": { "@type": "ImageObject", "url": "https://vayu-varta1-0.vercel.app/logo.png" }
      },
      "areaServed": { "@type": "Country", "name": "India" }
    }
    </script>

    <!-- ══ Favicon & PWA icons ══ -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />

    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.meteocons.com" />

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://db.onlinewebfonts.com/c/5ac3fe7c6abd2f62067f266d89671492?family=HelveticaNowDisplay-Medium" rel="stylesheet" />
