<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" >
<defs>
  <!-- Cloud gradient — 3D glass -->
  <radialGradient id="cloudGlass" cx="40%" cy="30%" r="70%">
    <stop offset="0%" stop-color="rgba(220,235,255,0.35)"/>
    <stop offset="50%" stop-color="rgba(180,210,240,0.18)"/>
    <stop offset="100%" stop-color="rgba(140,180,220,0.08)"/>
  </radialGradient>
  <!-- Sun gradient -->
  <radialGradient id="sunGrad" cx="45%" cy="40%" r="55%">
    <stop offset="0%" stop-color="#FFE066"/>
    <stop offset="50%" stop-color="#FBBF24"/>
    <stop offset="100%" stop-color="#F59E0B"/>
  </radialGradient>
  <!-- Moon gradient -->
  <radialGradient id="moonGrad" cx="35%" cy="35%" r="60%">
    <stop offset="0%" stop-color="#C4B5FD"/>
    <stop offset="50%" stop-color="#A78BFA"/>
    <stop offset="100%" stop-color="#8B5CF6"/>
  </radialGradient>
  <!-- Rain drop gradient -->
  <linearGradient id="rainGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#93C5FD"/>
    <stop offset="100%" stop-color="#3B82F6"/>
  </linearGradient>
  <!-- Snow gradient -->
  <radialGradient id="snowGrad" cx="40%" cy="35%" r="60%">
    <stop offset="0%" stop-color="#E0F2FE"/>
    <stop offset="100%" stop-color="#BAE6FD"/>
  </radialGradient>
  <!-- Lightning gradient -->
  <linearGradient id="lightGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#FDE68A"/>
    <stop offset="100%" stop-color="#F59E0B"/>
  </linearGradient>
  <!-- Storm cloud gradient -->
  <radialGradient id="stormCloud" cx="40%" cy="30%" r="70%">
    <stop offset="0%" stop-color="rgba(180,170,220,0.3)"/>
    <stop offset="50%" stop-color="rgba(130,120,180,0.15)"/>
    <stop offset="100%" stop-color="rgba(80,70,140,0.08)"/>
  </radialGradient>
  <!-- Fog gradient -->
  <linearGradient id="fogGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="rgba(200,210,225,0.0)"/>
    <stop offset="30%" stop-color="rgba(200,210,225,0.25)"/>
    <stop offset="70%" stop-color="rgba(200,210,225,0.25)"/>
    <stop offset="100%" stop-color="rgba(200,210,225,0.0)"/>
  </linearGradient>
  <!-- Glass highlight -->
  <linearGradient id="glassHighlight" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="rgba(255,255,255,0.4)"/>
    <stop offset="100%" stop-color="rgba(255,255,255,0.0)"/>
  </linearGradient>
  <!-- Hot gradient -->
  <radialGradient id="hotGrad" cx="45%" cy="40%" r="55%">
    <stop offset="0%" stop-color="#FCD34D"/>
    <stop offset="50%" stop-color="#F59E0B"/>
    <stop offset="100%" stop-color="#DC2626"/>
  </radialGradient>
  <!-- Cyan cold gradient -->
  <radialGradient id="coldGrad" cx="45%" cy="40%" r="55%">
    <stop offset="0%" stop-color="#E0F2FE"/>
    <stop offset="50%" stop-color="#7DD3FC"/>
    <stop offset="100%" stop-color="#0EA5E9"/>
  </radialGradient>
  <!-- Sunrise/Sunset -->
  <radialGradient id="sunriseGrad" cx="50%" cy="80%" r="50%">
    <stop offset="0%" stop-color="#FDE68A"/>
    <stop offset="100%" stop-color="#F97316"/>
  </radialGradient>
</defs>

<ellipse cx="48" cy="26" rx="25.5" ry="11.049999999999999" fill="url(#stormCloud)" stroke="rgba(200,220,255,0.25)" stroke-width="1.8"/>
<circle cx="39.5" cy="16.65" r="11.049999999999999" fill="url(#stormCloud)" stroke="rgba(200,220,255,0.25)" stroke-width="1.8"/>
<circle cx="54.8" cy="13.25" r="12.75" fill="url(#stormCloud)" stroke="rgba(200,220,255,0.25)" stroke-width="1.8"/>
<circle cx="48.0" cy="18.35" r="9.35" fill="url(#stormCloud)"/>
<!-- Glass highlight -->
<ellipse cx="49.7" cy="11.55" rx="6.8" ry="3.4" fill="url(#glassHighlight)" opacity="0.5"/>

<polygon points="48,40 42,54 49,54 44,68 54,52 47,52 53,40" fill="url(#lightGrad)" stroke="rgba(245,158,11,0.3)" stroke-width="0.8"/>
<line x1="47" y1="42" x2="44" y2="51" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-linecap="round"/>
</svg>